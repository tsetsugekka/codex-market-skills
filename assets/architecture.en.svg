<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1190" viewBox="0 0 960 1190" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">DayTrading.Monster — Plugin architecture</title>
<desc id="desc">Choose a skill by question; combine analysis as needed. Codex selects by task; every skill is a direct entry point. Arrows show task flow; groups organize capabilities, not a fixed execution sequence.</desc>
<defs><style>text{font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif;fill:#182638}.title{font-size:26px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#526174}.code{font-family:monospace;font-size:13px;fill:#526174}.edge{fill:none;stroke:#68788d;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#68788d"/></marker></defs>
<rect x="0" y="0" width="960" height="1190" rx="12" fill="#f7f9fc" stroke="#f7f9fc"/>
<text x="28" y="44" class="title">DayTrading.Monster</text>
<text x="28" y="76" class="body">Choose a skill by question; combine analysis as needed</text>
<text x="28" y="110" class="small">Plugin architecture</text>
<rect x="28" y="132" width="904" height="88" rx="12" fill="#eef0ff" stroke="#c7cdf5"/>
<text x="48" y="161" class="head">User question</text>
<text x="48" y="193" class="body">Stock moves · Market strategy · Technicals · Calendar</text>
<path d="M480 220V258" class="edge"/>
<text x="48" y="246" class="small">Codex selects by task; every skill is a direct entry point</text>
<rect x="28" y="272" width="904" height="451" rx="12" fill="#fff" stroke="#d9e0e9"/>
<text x="48" y="307" class="head">Research · 9 skills</text>
<rect x="48" y="329" width="276" height="285" rx="12" fill="#f7f9fc" stroke="#d9e0e9"/>
<text x="64" y="359" class="head">Stock moves</text>
<rect x="342" y="329" width="276" height="285" rx="12" fill="#f7f9fc" stroke="#d9e0e9"/>
<text x="358" y="359" class="head">Market &amp; strategy</text>
<rect x="636" y="329" width="276" height="285" rx="12" fill="#f7f9fc" stroke="#d9e0e9"/>
<text x="652" y="359" class="head">Specialist analysis</text>
<text x="64" y="392" class="body">A-share moves</text>
<text x="64" y="412" class="code">cn-stock-move-reason</text>
<text x="64" y="450" class="body">Japan moves / PTS</text>
<text x="64" y="470" class="code">jp-stock-move-reason</text>
<text x="64" y="508" class="body">US stock / ETF moves</text>
<text x="64" y="528" class="code">us-stock-move-reason</text>
<text x="358" y="392" class="body">A-share market tape</text>
<text x="358" y="412" class="code">cn-market-tape</text>
<text x="358" y="450" class="body">Premarket / closing review</text>
<text x="358" y="470" class="code">market-daily-strategist</text>
<text x="652" y="392" class="body">Macro context</text>
<text x="652" y="412" class="code">macro-news-check</text>
<text x="652" y="450" class="body">Technical structure</text>
<text x="652" y="470" class="code">stock-technical-analysis</text>
<text x="652" y="508" class="body">Sentiment &amp; expectations</text>
<text x="652" y="528" class="code">stock-sentiment-analysis</text>
<text x="652" y="566" class="body">US options gamma</text>
<text x="652" y="586" class="code">us-stock-gamma-moomoo</text>
<text x="48" y="643" class="small">Compose as needed: strategy uses move / specialist analysis; moves use macro / technicals / sentiment.</text>
<path d="M480 653V670" class="edge"/>
<text x="48" y="688" class="head">Outputs: move attribution · Strategy · Specialist reports</text>
<text x="48" y="711" class="small">Include sources, timestamps, confidence and validation conditions</text>
<rect x="28" y="747" width="904" height="169" rx="12" fill="#fffaf0" stroke="#e8d3a4"/>
<text x="48" y="780" class="head">Calendar · 1 skill</text>
<text x="48" y="815" class="body">Earnings / macro events</text>
<text x="48" y="840" class="code">market-calendar-google</text>
<text x="48" y="868" class="small">Filter · Time zones · Dedup</text>
<path d="M292 835H346" class="edge"/>
<text x="364" y="840" class="head">Event list</text>
<path d="M505 835H583" class="edge"/>
<text x="594" y="815" class="small">Write after user approval</text>
<text x="594" y="846" class="head">Google Calendar</text>
<text x="48" y="899" class="small">Separate workflow; writing requires a Google Calendar connection.</text>
<rect x="28" y="940" width="904" height="202" rx="12" fill="#eef5f7" stroke="#cddfe4"/>
<text x="48" y="974" class="head">External data &amp; tools</text>
<text x="48" y="1001" class="small">Skills collect evidence per task; external dependencies are not bundled</text>
<text x="48" y="1040" class="head">DTM + public sources</text>
<text x="48" y="1070" class="small">Themes / news / ratings / PTS</text>
<text x="48" y="1100" class="small">Disclosures, quotes, community</text>
<text x="350" y="1040" class="head">MX / moomoo</text>
<text x="350" y="1070" class="small">Selected by market &amp; module</text>
<text x="350" y="1100" class="small">Some modules need extra skills</text>
<text x="646" y="1040" class="head">Full-chain gamma</text>
<text x="646" y="1070" class="small">Local OpenD + SDK</text>
<text x="646" y="1100" class="small">Also requires moomooapi</text>
<text x="28" y="1173" class="small">Arrows show task flow; groups organize capabilities, not a fixed execution sequence.</text>
</svg>
