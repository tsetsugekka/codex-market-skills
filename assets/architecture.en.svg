<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1450" viewBox="0 0 1800 1450" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">DayTrading.Monster Plugin Architecture</title>
<desc id="desc">Skills → Data sources → Call relationships → Outputs. Logical collaboration, not an execution trace. Availability depends on the host. No bundled scheduler or automatic trading.</desc>
