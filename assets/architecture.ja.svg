<text x="48" y="815" class="body">決算 / マクロイベント</text>
<text x="48" y="840" class="code">market-calendar-google</text>
<text x="48" y="868" class="small">選別 · 時差 · 重複排除</text>
<path d="M292 835H346" class="edge"/>
<text x="364" y="840" class="head">イベント一覧</text>
<path d="M505 835H583" class="edge"/>
<text x="594" y="815" class="small">ユーザー承認後に書き込み</text>
<text x="594" y="846" class="head">Google Calendar</text>
<text x="48" y="899" class="small">独立したフロー。書き込みには Google Calendar 接続が必要。</text>
<rect x="28" y="940" width="904" height="202" rx="12" fill="#eef5f7" stroke="#cddfe4"/>
<text x="48" y="974" class="head">外部データとツール</text>
<text x="48" y="1001" class="small">タスクごとに根拠を収集。外部依存はプラグインに同梱しない</text>
<text x="48" y="1040" class="head">DTM + 公開情報</text>
<text x="48" y="1070" class="small">テーマ / ニュース / 評価 / PTS</text>
<text x="48" y="1100" class="small">開示・相場・掲示板サンプル</text>
<text x="350" y="1040" class="head">MX / moomoo</text>
<text x="350" y="1070" class="small">市場・モジュール別に利用</text>
<text x="350" y="1100" class="small">一部は追加 Skill が必要</text>
<text x="646" y="1040" class="head">全チェーン Gamma</text>
<text x="646" y="1070" class="small">ローカル OpenD + SDK</text>
<text x="646" y="1100" class="small">moomooapi も必要</text>
<text x="28" y="1173" class="small">矢印はタスクの流れ。グループは機能の分類であり、固定の実行順序ではありません。</text>
